<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal ARG Teia-Rasa Myxveil</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="images/x-icon.ico">
</head>

<body>

  <!-- ======================================================
       MODAL DE PRIMEIRA VISITA
  ====================================================== -->
  <div id="onboarding-modal" class="hidden">
    <div class="modal-box">
      <h2>IDENTIFICAÇÃO REQUERIDA</h2>
      <p>Antes de continuares, o sistema precisa de te registar. Estes dados ficam guardados apenas neste dispositivo.</p>

      <form id="onboarding-form">
        <label for="real-name">O teu nome (fora do jogo):</label>
        <input type="text" id="real-name" autocomplete="off" required>

        <label for="username">Nome de utilizador para o ARG:</label>
        <input type="text" id="username" autocomplete="off" required>

        <div class="modal-error" id="onboarding-error"></div>

        <button type="submit">CONFIRMAR</button>
      </form>
    </div>
  </div>

  <!-- ======================================================
       SEQUÊNCIA DE ARRANQUE
  ====================================================== -->
  <div id="boot-screen" class="hidden">
    <div id="boot-lines"></div>
  </div>

  <!-- ======================================================
       ECRÃ PRINCIPAL
  ====================================================== -->
  <div id="main-screen" class="hidden-init">

    <!-- Nós escondidos (pistas do ARG) -->
    <a href="locations/loc1.html" class="hidden-node node-1" title="???">·</a>
    <a href="locations/loc2.html" class="hidden-node node-2" title="???">·</a>
    <a href="locations/loc3.html" class="hidden-node node-3" title="???">·</a>
    <a href="locations/loc1.html" class="hidden-node node-4" title="???">·</a>
    <a href="locations/loc2.html" class="hidden-node node-5" title="???">·</a>

    <img
      src="images/terminal-icon.png"
      alt="Terminal"
      class="terminal-icon"
      draggable="false">

    <div class="prompt-label" id="prompt-label">INSIRA A CHAVE DE ACESSO</div>

    <div class="key-input-wrap">
      <div id="key-display" aria-hidden="true"></div>
      <input type="text" id="key-real-input" autocomplete="off" spellcheck="false">
    </div>

    <div id="key-response"></div>

    <div id="final-reveal" class="hidden">
      <h1 class="final-title">Bem vindo Yuri</h1>
      <a href="https://discord.gg/dKTYwhnE" target="_blank" rel="noopener" class="final-discord-link">discord.gg/dKTYwhnE</a>
      <p class="final-note">(completaste o ARG, parabéns! Se queres interagir com BEPO, entra no discord)</p>
    </div>

    <!-- ======================================================
         STATUS DO TERMINAL
    ====================================================== -->
    <div id="terminal-status">
      <div id="status-user"></div>
      <div id="status-status"></div>
      <div id="status-track"></div>
      <div id="status-uptime"></div>
    </div>

  </div>

  <div id="fade-screen"></div>

  <script src="script.js"></script>
</body>
</html>
